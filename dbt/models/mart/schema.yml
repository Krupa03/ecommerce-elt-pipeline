version: 2

models:
  - name: mart_sales_summary
    description: "Final mart table combining orders, items, payments and customer location. 
    One row per order. Used for sales reporting and KPI tracking."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        tests:
          - not_null
          - unique
      - name: total_items
        description: "Total number of items in the order."
      - name: total_payment_value
        description: "Total payment value for the order."
      - name: order_month
        description: "Month of the order truncated to month level."

  - name: mart_customer_ltv
    description: "Customer lifetime value mart. One row per customer with 
    aggregated order history, revenue, and segmentation."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        tests:
          - not_null
      - name: lifetime_value
        description: "Total revenue generated by the customer."
      - name: customer_segment
        description: "Customer segment based on lifetime value: high, medium, low."
        tests:
          - accepted_values:
              values: ['high', 'medium', 'low']