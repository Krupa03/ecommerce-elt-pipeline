name: 'ecommerce_elt'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_elt'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
docs-paths: ["docs"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecommerce_elt:
    staging:
      +materialized: view
      +schema: staging
      +docs:
        node_color: "#5EB3D4"
    intermediate:
      +materialized: view
      +schema: intermediate
      +docs:
        node_color: "#F0A500"
    mart:
      +materialized: table
      +schema: mart
      +docs:
        node_color: "#2ECC71"